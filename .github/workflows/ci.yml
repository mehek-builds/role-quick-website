# Run the checks this repo already has, on every change, without anyone
# remembering to.
#
# WHY THIS EXISTS. The repo had no CI at all. Every guarantee in tests/ (the
# vocabulary gate, route integrity, the typography scale, the logo service's
# SSRF allowlist) only held when somebody happened to run `npm test` locally.
# They did not always: `main` sat red for a day on a stale assertion in
# application-submission-gate, and a red suite is worse than no suite, because
# once failure is normal nobody reads the output.
#
# Deliberately NO secrets and NO deploy step. The deploy workflow that used to
# live here was deleted after its VERCEL_TOKEN expired and every run went red
# for weeks unnoticed (see the vault's R-034). This one only ever reads the
# code, so it cannot rot that way and cannot be blocked by a deploy cap.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fast and highest-signal first, so a broken invariant is reported in
      # under a minute rather than after a full build.
      - name: Tests
        run: npm test

      # TYPES, BEFORE THE BUILD, because 36 seconds of tsc beats four minutes of
      # next build for the same answer on most breaks.
      #
      # This step was deliberately absent, and the reason is worth keeping: tsc
      # used to report pre-existing TS5097 errors in .mts test files, so its
      # output was treated as noise and a real error in app code was never
      # reached (PR #88). Measured on main 2026-08-20 that noise is gone - zero
      # TS5097, clean exit - so the objection no longer holds and the gate is
      # worth having again.
      #
      # It does NOT replace Build. `next build` type-checks app/ through the
      # Next plugin and catches route and server-component mistakes tsc alone
      # does not see, which is why both run.
      #
      # The backend has carried this gate for a while, and the reason this one
      # was added is that its absence cost something concrete: an
      # `import.meta.url` in a backend test passed `npm test` under tsx and
      # failed `tsc --noEmit`, turning main red (volley-backend #643, repaired
      # in #644). Two runners, two answers, and only one of them was being run
      # here.
      - name: Typecheck
        run: npm run typecheck

      # Vendored browser bundles are excluded explicitly, so lint output now reflects first-party
      # code. Errors fail immediately and the measured warning budget cannot grow silently.
      - name: Lint
        run: npm run lint -- --max-warnings 25

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://student-outreach-backend.vercel.app

  # SEPARATE JOB ON PURPOSE, and named for what it is.
  #
  # This one needs a Chromium binary downloaded at run time, which is the single
  # step in this file that can fail for a reason that has nothing to do with the
  # product. Folded into `check` it would turn a CDN hiccup into a red tick next
  # to "Tests" and teach everyone to ignore the tick. Kept apart, "Click path
  # (browser)" going red while "check" stays green reads as exactly what it is:
  # the browser did not arrive.
  #
  # It is also why the dependency is playwright-core rather than playwright.
  # playwright-core has no postinstall, so `npm ci` above cannot slow down or
  # fail on a browser fetch, and `npm test` stays a pure static suite. The
  # browser is fetched here, once, by the one job that needs it.
  # It now carries two browser specs rather than one, and the job id and display name still say
  # "click path". They are deliberately NOT renamed: the name is what any branch protection rule
  # references, and a rename silently turns a required check into a missing one. The step names say
  # which spec failed, which is where anyone reading a red run actually looks.
  click-path:
    name: Click path (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # playwright-core ships no installer, so the browser comes from the
      # separately versioned playwright CLI. The version is DERIVED FROM THE
      # INSTALLED PACKAGE, never written out here: package.json carries a caret,
      # so a hard-coded CLI version stays put while `npm update` moves
      # playwright-core underneath it, the downloaded browser revision stops
      # matching the one playwright-core looks for, and the job dies with
      # "Executable doesn't exist", which looks nothing like its cause.
      # --with-deps because a bare GitHub runner is missing the shared libraries
      # headless Chromium links against.
      - name: Install Chromium
        run: |
          version="$(node -p "require('playwright-core/package.json').version")"
          echo "installing browsers for playwright-core ${version}"
          npx --yes "playwright@${version}" install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://student-outreach-backend.vercel.app

      - name: Audited state contracts spec
        run: npm run test:audited-state-contracts

      # Drives the four Home Overview controls with real clicks against a
      # stubbed backend. Every request is intercepted; nothing reaches a real
      # service and no credential exists to reach one with.
      - name: Click path spec
        run: npm run test:click-path

      # Proves route snapshots and the mobile sheet animate in a real browser, then reruns the
      # route under the operating system reduced-motion preference. Source checks alone cannot
      # observe the snapshot lifecycle or focus return.
      - name: Dashboard motion spec
        run: npm run test:dashboard-motion

      # Locks the production geometry, focus, error recovery, tab semantics, and reflow contracts
      # established by the dashboard visual QA pass. The spec keeps screenshots for every green run.
      - name: Dashboard visual regressions spec
        run: npm run test:dashboard-visual-regressions

      - name: Quality refactor regression spec
        run: npm run test:quality-refactor

      # Row-opens-in-place, focused-workspace identity above the fold on desktop and mobile, and
      # browser Back/Forward between an application and the ledger. Absent from this job until now,
      # which is how a change to the dashboard's whole submission-display contract reached PR #466
      # with nothing red: CI never looked at these, so eleven behaviours went unobserved.
      - name: Tracker row opens detail spec
        run: npm run test:tracker-row

      # "A slow send cannot be sent twice" and "the progress screen does not claim nothing is sent
      # while it is sending" live here. Those are the guards against submitting one application to
      # an employer twice and against an operator believing nothing happened and pressing again,
      # which are the two failure modes this whole product is built to prevent. They were not in
      # CI either.
      - name: Approve resolves spec
        run: npm run test:approve

      # Same gap: every case walks a packet to its audited control and through an accepted or
      # refused send, so all six went red the moment a response had to carry submission authority
      # rather than just claim a status, and CI saw none of it.
      - name: Packet flow refusals spec
        run: npm run test:packet-flow-refusals

      # Same job, same Chromium, same build. The base resume step's build start is a RACE between
      # two fetches, so it has no source-level cover at all: tests/start-onboarding-defects.test.mjs
      # can only pin the shape of the fix. This spec forces the losing ordering and is the only
      # thing that fails when the defect returns, which is precisely why it must not be a script
      # somebody remembers to run.


      - name: Country eligibility onboarding and settings spec
        run: npm run test:country-eligibility-flow

      - name: Onboarding and empty-state checklist spec
        run: npm run test:checklist-flow

      # The end-to-end walk of /start, and the only thing that watches the step rail's arithmetic
      # against the screens a student is actually shown. It was written for #285 and then never
      # added here, so the walk it describes ran only when somebody remembered the script: the
      # denominator regressed to a count that skipped a number and CI stayed green through it.
      # Reuses the build and the Chromium already installed by the steps above.
      - name: Start onboarding checklist walk
        run: npm run test:start-checklist

      # The application sequence, walked end to end against a stubbed backend. It belongs in CI for
      # the same reason it stubs: the last screen of that flow sends a real application, so the one
      # place its behaviour can be checked on every push is against a stub that asserts the request
      # rather than its effect.
      - name: Application sequence walk
        run: npm run test:start-application

      - name: Narrow viewport actions spec
        run: npm run test:narrow-viewport

      # The whole value of that spec is observing rendered behaviour, and nobody
      # can reproduce a runner by hand. Without this, its first CI-only failure
      # is a bare locator timeout with no picture. The spec writes a full-page
      # screenshot, the serialised DOM and a Playwright trace on failure and
      # nothing at all on success, so this upload is empty on a green run.

      # LAST ON PURPOSE. These steps run sequentially, so whichever fails first skips every
      # step after it. This spec is currently red on one case whose payload the board's submission
      # authority gate now rejects before render, and while it sat above them it was silently
      # skipping the four onboarding and sequence walks below. Keeping it last means a known-red
      # containment case cannot hide a regression in anything else.
      #
      # It reuses the build and Chromium above rather than paying for either twice. It is the ONLY
      # thing that can observe the per-band error boundaries actually CONTAINING a throw, so leaving
      # it out of CI would mean a refactor could delete the containment silently.
      # tests/section-boundary-placement.test.mjs covers the boundaries still EXISTING from inside
      # `npm test`; only this one covers them working.
      - name: Partial payload containment spec
        run: npm run test:partial-payload

      - name: Failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: click-path-artifacts
          path: |
            test-results/click-path/
            test-results/country-eligibility-flow/
            test-results/dashboard-visual-regressions/
            test-results/narrow-viewport/
          if-no-files-found: ignore
          retention-days: 7
