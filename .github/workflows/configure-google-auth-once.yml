name: Configure Google Auth Environment

on:
  push:
    branches: [codex/google-sign-in]

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_0Fjyz6MMpB2jQ9OBDySdm11i
      GOOGLE_CLIENT_ID: 719679889441-oto6bdqapcrdmcso8lsfs46qc4nvpb3s.apps.googleusercontent.com
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure website
        env:
          VERCEL_PROJECT_ID: prj_nAijw4PLiUTkbTVy4AbMAsmceXGE
        run: printf '%s\n' "$GOOGLE_CLIENT_ID" | npx vercel@latest env add NEXT_PUBLIC_GOOGLE_CLIENT_ID production --force --token "$VERCEL_TOKEN"
      - name: Configure API
        env:
          VERCEL_PROJECT_ID: prj_5gPI7ADAT5M26VIxhiAKe1efsJPi
        run: printf '%s\n' "$GOOGLE_CLIENT_ID" | npx vercel@latest env add GOOGLE_CLIENT_ID production --force --token "$VERCEL_TOKEN"
